<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Recommender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 50px;
        }

        h1 {
            margin-bottom: 30px;
        }

        input {
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #e50914;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #b20710;
        }

        #results {
            margin-top: 30px;
        }

        .movie {
            margin: 10px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>🎬 Movie Recommender</h1>

    <input type="text" id="movieInput" placeholder="Enter a movie..." />
    <button onclick="getRecommendations()">Search</button>

    <div id="results"></div>

    <script src="/static/script.js"></script>

</body>
</html>
